{% extends 'library/base.html' %}

{% block title %}Eliminar libro{% endblock %}

{% block content %}
<h1>Eliminar libro</h1>
<p>¿Seguro que quieres eliminar "{{ object.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a class="button secondary" href="{% url 'libro-detalle-html' object.pk %}">Cancelar</a>
</form>
{% endblock %}
