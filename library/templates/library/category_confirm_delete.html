{% extends 'library/base.html' %}

{% block title %}Eliminar categoría{% endblock %}

{% block content %}
<h1>Eliminar categoría</h1>
<p>¿Seguro que deseas eliminar la categoría "{{ object.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a class="button secondary" href="{% url 'category-list-html' %}">Cancelar</a>
</form>
{% endblock %}
